name: Sprint 2 combined integration checks
on:
  push:
    branches: [sprint2-integrate-users-auth-main, sprint2-ticket4-study-availability]
  pull_request:
    paths:
      - '**/*.py'
      - 'templates/**'
      - '.github/workflows/sprint2-integration.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_authentication.py
      - run: python -m pytest -q tests/test_integration.py
      - run: python -m pytest -q tests/test_scheduler.py tests/test_user_migration.py
      - run: python -m pytest -q tests/test_canvas_connection.py
      - run: python -m pytest -q tests/test_canvas_import.py tests/test_presentation.py tests/test_spaced_scheduler.py
      - run: python -m pytest -q tests/test_availability.py tests/test_saved_sessions.py tests/test_session_completion.py tests/test_privacy.py
      - run: python -m pytest -q
      - run: python -m compileall -q app.py auth.py models.py canvas_connection.py scheduler.py migrations.py
