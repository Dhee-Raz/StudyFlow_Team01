name: Ticket 1 database migration tests

on:
  push:
    branches:
      - sprint2-ticket1-user-model-migration
  pull_request:
    paths:
      - 'models.py'
      - 'scripts/migrate_users.py'
      - 'tests/test_user_migration.py'
      - '.github/workflows/ticket1-migration.yml'

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_user_migration.py
      - run: python -m compileall -q models.py scripts/migrate_users.py
