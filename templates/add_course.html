<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>
</head>

<body>

    <h1>Add Course</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label for="name">Course Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Example: CS 3398"
        >

        <button type="submit">Add Course</button>
    </form>

</body>
</html>
